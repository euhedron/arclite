name: Release

# On a version tag (`git tag v0.1.5 && git push --tags`), build the per-OS binaries and publish them as
# GitHub Release assets. Each Rust target builds on an available runner: Linux (x86_64 and, on the
# arm hosted runner, aarch64) and Windows native, and BOTH macOS arches on the Apple-Silicon runner
# (aarch64 native, x86_64 cross-compiled — one macOS SDK builds both). We deliberately avoid a separate Intel-macOS (`macos-13`) runner: in the v0.1.4 release
# that job never obtained a runner and GitHub auto-cancelled it at the documented 24h queue limit, while
# every other job started within seconds. Asset names must be exactly what `arc update --apply` fetches
# — the convention lives in update.rs::asset_name, and the
# `release_workflow_assets_follow_the_one_naming_convention` test holds this matrix to it (edit either
# side alone and `cargo test` fails).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Create the Release once, as a draft, before the matrix uploads race to attach assets to it.
  # A draft stays mutable while the binaries are assembled; the final job publishes it only after
  # every upload succeeds. That order is required when repository release immutability is enabled.
  # Context values reach every `run:` below as environment variables, never inline `${{ }}`
  # interpolation into the script text: a ref name is repo-controlled input, and a tag like
  # `v1$(cmd)` is valid to git — as an env var it's inert data the shell quotes, not grammar.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      already_published: ${{ steps.release.outputs.already_published }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate the tag — a safe path segment that matches Cargo.toml's version
        env:
          TAG: ${{ github.ref_name }}
        # The tag names release assets and rides into `cp` paths in the upload matrix; `v*` still
        # admits separators and metacharacters (`v1/x`), so require the shape the updater fetches
        # before anything acts on it. And the tag must be `v<Cargo.toml version>` exactly: the
        # updater treats the tag as the version it installs, so a mismatched tag would publish
        # binaries that report a different version than their release claims. The upload job needs
        # this one, so a bad tag stops everything.
        run: |
          case "$TAG" in
          *[!A-Za-z0-9._-]* | "")
            echo "tag '$TAG' is not a single safe path segment — refusing to release it" >&2
            exit 1
            ;;
          esac
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$CARGO_VERSION" ]; then
            echo "tag '$TAG' does not match Cargo.toml's version 'v$CARGO_VERSION' — refusing to release a mislabeled binary" >&2
            exit 1
          fi
      - name: Create the draft release (idempotent)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # A failed run can resume an existing draft. A re-run of an already-published release is a
        # no-op: its assets may be immutable, so the upload jobs must not try to clobber them.
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)
            if [ "$IS_DRAFT" = "false" ]; then
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --notes "arc $TAG" \
              --verify-tag \
              --draft
          fi
          echo "already_published=false" >> "$GITHUB_OUTPUT"

  upload:
    needs: create-release
    if: needs.create-release.outputs.already_published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: arc
            asset: arc-${{ github.ref_name }}-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: arc
            asset: arc-${{ github.ref_name }}-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: arc
            asset: arc-${{ github.ref_name }}-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: arc
            asset: arc-${{ github.ref_name }}-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: arc.exe
            asset: arc-${{ github.ref_name }}-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      BIN: ${{ matrix.bin }}
      ASSET: ${{ matrix.asset }} # carries the ref name — env-var indirection like TAG, same reason
    # One shell for every step on every runner: windows-latest defaults to pwsh, where `"$TARGET"`
    # is NOT an env-var reference (that's `$env:TARGET`) — rustup received an empty target and the
    # v0.1.8 Windows build died on it. Bash exists on all three runners; the env-var indirection
    # above assumes POSIX expansion, so the job states that assumption once instead of per step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Add the Rust target
        run: rustup target add "$TARGET"
      - run: cargo build --release --locked --target "$TARGET"
      - name: Stage the asset under its release name
        run: cp "target/$TARGET/release/$BIN" "$ASSET"
      - name: Upload the asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: >
          gh release upload "$TAG" "$ASSET"
          --repo "$REPO" --clobber

  # SHA256SUMS covering every uploaded binary, attached while the release is still a mutable
  # draft (assets freeze at publish). Same-channel checksums: corruption/tamper-in-transit defense
  # for the install scripts and the tap bump below — not an independent trust root (that deeper
  # edge — out-of-band signing — stays with the release-verification item).
  checksums:
    needs: [create-release, upload]
    if: needs.create-release.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Attach SHA256SUMS over the uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir sums && cd sums
          gh release download "$TAG" --repo "$REPO" --pattern 'arc-*'
          sha256sum arc-* > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$REPO" --clobber

  publish-release:
    needs: [create-release, upload, checksums]
    if: needs.create-release.outputs.already_published != 'true' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false

  # Chain the post-release verifier explicitly: the `release: published` event this workflow
  # causes is suppressed for other workflows (it was created by the workflow token — GitHub's
  # recursion guard), and workflow_dispatch is the documented exception that does run. Without
  # this, the verifier only runs when dispatched by hand.
  verify:
    needs: [create-release, publish-release]
    if: needs.create-release.outputs.already_published != 'true'
    # The workflow's top-level grant is contents-only, which zeroes every other permission — and
    # creating a workflow_dispatch event needs `actions: write`. Granted here, on the one job that
    # dispatches, rather than widened for the whole workflow.
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verify-release against this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh workflow run verify-release.yml --repo "$REPO" -f "tag=$TAG"

  # Bump the Homebrew tap (euhedron/homebrew-arc) to the just-published release. The cross-repo
  # push needs a fine-grained PAT with contents:write on the tap repo, stored as the
  # TAP_GITHUB_TOKEN secret (set out-of-band; its value never appears in output or argv — it rides
  # a GIT_CONFIG_* env var, not the remote URL). Without the secret this skips with a notice: the
  # release is complete either way, and the tap can be bumped by hand via its ./bump.sh.
  tap:
    needs: [create-release, publish-release]
    if: needs.create-release.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Bump euhedron/homebrew-arc (skips without TAP_GITHUB_TOKEN)
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN is not set — skipping the Homebrew tap bump (run homebrew-arc's ./bump.sh by hand)"
            exit 0
          fi
          curl -fsSL -o SHA256SUMS "https://github.com/$REPO/releases/download/$TAG/SHA256SUMS"
          sum() { awk -v name="arc-$TAG-$1" '$2 == name { print $1 }' SHA256SUMS; }
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git clone --depth 1 https://github.com/euhedron/homebrew-arc.git tap
          cd tap
          ./bump.sh "$TAG" "$(sum macos-aarch64)" "$(sum macos-x86_64)" "$(sum linux-x86_64)" "$(sum linux-aarch64)"
          git -c user.name="arc release workflow" -c user.email="noreply@euhedron.com" commit -am "arc $TAG"
          git push origin HEAD:main
