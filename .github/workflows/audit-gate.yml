name: audit gate

# The audit gate as a PR check — the github-check-gate item's workflow: the same audit invocation
# the pre-push hook fires, run where a contributor without the hook can't route around it. Written
# step-for-step as the seed the arc-action composite extracts (the ladder: workflow → Action → App),
# so the workflow and the future Action can't fork.
#
# Spends real AI tokens per run (~$3-4 at the default model and src scope, echoed in the run report)
# from the ANTHROPIC_API_KEY repository secret. Not yet a *required* status check — that flip is a
# branch-ruleset change, the operator's call once the check has proven itself on real PRs.
on:
  pull_request:

# One live run per PR: a rapid follow-up push supersedes the previous run instead of spending beside it.
concurrency:
  group: audit-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install arc (pinned release; install.sh verifies its SHA256SUMS)
        run: |
          curl -fsSL https://raw.githubusercontent.com/euhedron/arclite/main/install.sh | sh -s v0.1.14
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the backend CLI (pinned to the boundary-audited version)
        run: npm install -g @anthropic-ai/claude-code@2.1.216
      - name: Run the audit gate (backend explicit — never defaulted)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: arc run audit . --backend claude --include src --findings --fail-on-findings
      - name: Upload the run record (the ledger-native ingest artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-run-record
          path: |
            ~/.arc/logs/runs.jsonl
            ~/.arc/logs/results/
          if-no-files-found: warn
