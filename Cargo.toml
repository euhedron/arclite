[package]
name = "arclite"
version = "0.1.14"
edition = "2024"
rust-version = "1.88"
description = "Agent-first, cross-platform CLI for AI-powered cross-repo code intelligence and auditing."
license = "MIT"
repository = "https://github.com/euhedron/arclite"
homepage = "https://euhedron.com/portfolio/arclite"
keywords = ["audit", "cli", "linter", "ai", "code-review"]
categories = ["command-line-utilities", "development-tools"]
# The publish guard stays on until a deliberate release cut arms `cargo publish` (see the release
# item): metadata and discoverability fields are staged here so the cut is only the version bump
# and this flip, never a scramble for a crates.io listing.
publish = false

[[bin]]
name = "arc"
path = "src/main.rs"

[lib]
name = "arclite"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "6"
ignore = "0.4.26"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "8"

[dev-dependencies]
assert_cmd = "2"
yaml-rust2 = "0.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
