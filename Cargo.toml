[package]
name = "arclite"
version = "0.1.15"
edition = "2024"
rust-version = "1.88"
description = "Agent-first, cross-platform CLI for AI-powered cross-repo code intelligence and auditing."
license = "MIT"
repository = "https://github.com/euhedron/arclite"
homepage = "https://euhedron.com/portfolio/arclite"
keywords = ["audit", "cli", "linter", "ai", "code-review"]
categories = ["command-line-utilities", "development-tools"]
# The published crate ships only what a consumer needs to build and read: source, the README's
# assets, and `.arc/rules/` (build.rs embeds it as the built-in `default` ruleset). arc's own dev
# substrate — the agenda, findings ledger, inbox, meta/behavioral rulesets, hooks — and CI wiring
# are this repo's proving ground, not the crate's payload.
exclude = [
    ".arc/items/",
    ".arc/findings/",
    ".arc/inbox/",
    ".arc/meta-rules/",
    ".arc/behavioral-rules/",
    ".arc/hooks/",
    ".arc/settings.json",
    ".github/",
    "tui-shots/",
]

[[bin]]
name = "arc"
path = "src/main.rs"

[lib]
name = "arclite"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "6"
ignore = "0.4.26"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "8"

[dev-dependencies]
assert_cmd = "2"
yaml-rust2 = "0.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
